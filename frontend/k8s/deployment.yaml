apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-react-frontend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-react-frontend
  template:
    metadata:
      labels:
        app: llm-react-frontend
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret # Harbor 사용 시 필요 (지금은 placeholder)
      containers:
        - name: llm-react-frontend
          image: REPLACE_WITH_HARBOR_IMAGE # ← 나중에 Harbor 주소로 교체
          imagePullPolicy: Always
          ports:
            - containerPort: 80 # Nginx 기본 포트
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
